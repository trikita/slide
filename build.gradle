buildscript {
    repositories {
        google()
        mavenCentral()
        jcenter() // for legacy trikita dependencies
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}
apply plugin: 'com.android.application'

android {
    namespace 'trikita.slide'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        versionCode 4
        versionName "1.3"
        minSdkVersion 21
        targetSdkVersion 35
    }

    signingConfigs {
        release
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFile getDefaultProguardFile('proguard-android.txt')
            signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    google()
    mavenLocal()
    mavenCentral()
    jcenter() // for legacy trikita dependencies
    maven { url 'https://jitpack.io/' }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'

    implementation 'co.trikita:anvil-sdk21:0.5.0'
    implementation 'com.github.trikita:jedux:-SNAPSHOT'
    implementation 'com.github.trikita:promote:-SNAPSHOT'

    implementation 'com.squareup.picasso:picasso:2.71828'

    implementation 'org.immutables:gson:2.1.14'
    annotationProcessor 'org.immutables:value:2.1.14'
    compileOnly 'org.immutables:value:2.1.14'
}

try {
    apply from: 'https://raw.github.com/trikita/gradle-android-signing/master/gradle-android-signing.gradle'
} catch (Exception ignored) {
}
